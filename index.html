#home:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 62% 42%,transparent 38%,#000d 100%),linear-gradient(#0008,transparent 30%,transparent 60%,#000a)}
#ttl{position:absolute;right:6vw;top:13vh;text-align:right;z-index:2}
#ttl h1{margin:0;font:200 clamp(38px,7vw,92px)/1 "Bahnschrift","DIN Alternate","Arial Narrow",sans-serif;letter-spacing:.32em;margin-right:-.32em;text-shadow:0 0 40px #6fb7ff66}
#ttl p{margin:14px 0 0;color:#cfe0ff;font-size:clamp(13px,1.5vw,18px);letter-spacing:.06em}
#st{position:absolute;right:6vw;bottom:16vh;z-index:3;background:#ff6a2b;color:#1a0800;border:0;border-radius:40px;padding:16px 34px;font:700 18px "Segoe UI",sans-serif;cursor:pointer;animation:pl 1.6s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 #ff6a2bcc}100%{box-shadow:0 0 0 26px #ff6a2b00}}
#st:before{content:"👉";position:absolute;left:-44px;top:10px;font-size:26px;animation:pt 1s ease-in-out infinite alternate}
@keyframes pt{to{transform:translateX(10px)}}
#lg{position:fixed;left:14px;top:calc(12px + env(safe-area-inset-top,0px));z-index:30;display:flex;gap:4px}
#lg button{background:#06101cbb;color:var(--mu);border:1px solid #ffffff33;border-radius:4px;padding:5px 10px;font:600 12px inherit;cursor:pointer}
#lg button.on{color:#fff;border-color:var(--cy)}
.pn{position:absolute;right:16px;top:calc(52px + env(safe-area-inset-top,0px));width:376px;max-height:calc(100% - 70px - env(safe-area-inset-top,0px));overflow:auto;background:#050b14d9;backdrop-filter:blur(14px);border:1px solid #ffffff26;border-top:2px solid var(--ac);border-radius:4px;padding:14px 16px}
.pn h2{margin:0 0 3px;font:600 19px "Bahnschrift","Segoe UI",sans-serif;letter-spacing:.02em}.pn p{margin:0 0 10px;color:var(--mu);font-size:13px;line-height:1.45}
.pn h3{margin:12px 0 6px;font-size:12px;font-weight:600;color:var(--cy)}
.opts{display:grid;gap:6px}
.o{display:flex;gap:9px;align-items:center;text-align:left;background:#0a1626;border:1px solid #ffffff24;color:var(--tx);border-radius:4px;padding:7px 10px;cursor:pointer;font:inherit;font-size:13px}
.o:hover{border-color:var(--mu)}.o.on{border-color:var(--ac);background:#2a1608}.o b{flex:1;font-weight:600}.o span{color:var(--mu);font-size:11px}
.btn{width:100%;background:var(--ac);color:#1a0800;border:0;border-radius:4px;padding:12px;font:700 15px inherit;cursor:pointer;margin-top:12px}
.btn:disabled{background:#2a3446;color:#6d7d99;cursor:not-allowed}.btn.g{background:transparent;color:var(--tx);border:1px solid #ffffff44;margin-top:6px}
:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
.gg{margin:5px 0;font-size:11px;color:var(--mu)}.gg div{display:flex;justify-content:space-between}.br{height:6px;background:#0a1220;border:1px solid #ffffff1f;margin-top:2px}.br i{display:block;height:100%;background:var(--cy);transition:width .3s}.br i.w{background:#ffc247}.br i.x{background:var(--bad)}
.err{color:var(--bad);font-size:13px;margin:8px 0 0}.big{font:700 34px "Bahnschrift",sans-serif;color:#ffc247}
#vw{position:absolute;left:50%;transform:translateX(-50%);top:calc(52px + env(safe-area-inset-top,0px));display:flex;gap:4px;z-index:5}
#vw button,#tab button{background:#06101cd0;color:var(--mu);border:1px solid #ffffff2e;border-radius:4px;padding:7px 13px;font:600 12px inherit;cursor:pointer}
#vw button.on,#tab button.on{color:#fff;border-color:var(--ac)}
#tab{position:absolute;left:50%;transform:translateX(-50%);top:calc(52px + env(safe-area-inset-top,0px));display:flex;gap:4px;z-index:5}
#tel{position:absolute;left:16px;top:calc(52px + env(safe-area-inset-top,0px));font:600 13px/1.7 "Bahnschrift","Segoe UI",sans-serif;color:var(--cy);background:#050b14b0;border-left:2px solid var(--cy);padding:6px 12px;z-index:5;white-space:pre}
#prof{position:fixed;left:6px;bottom:calc(4px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:flex-end;gap:6px;max-width:calc(100% - 410px);pointer-events:none}
#prof>*{pointer-events:auto}
#pv{width:178px;flex:none;filter:drop-shadow(0 8px 14px #000a);animation:bob 4s ease-in-out infinite;transition:width .8s}
body.hm #pv{width:min(34vw,300px)}
@keyframes bob{50%{transform:translateY(-7px)}}
#bub{position:relative;background:#f7f9ff;color:#0e1830;border-radius:24px;padding:13px 17px 11px;margin-bottom:90px;font-size:15px;line-height:1.45;max-width:420px;min-width:190px;box-shadow:0 8px 28px #000a}

let L="fr";const t=k=>T[L][k]??T.fr[k];
/* ---- physique simplifiée (valeurs fictives) ---- */
const INS=[{m:40,p:120,c:30,r:10,q:[1,.55,.35],g:{c:[0,-.85,.3],s:[.5,.5,.7]}},{m:90,p:300,c:60,r:16,q:[.9,.7,.5],g:{c:[0,-.68,0],s:[1.8,.08,.9]}},{m:20,p:60,c:15,r:5,q:[.6,.85,1],g:{c:[0,-.78,.4],s:[.35,.35,.35]}}];
const PW=[{w:200,m:15,c:5},{w:500,m:35,c:12},{w:900,m:60,c:20}],AN=[{r:.02,m:1,p:4,c:3},{r:3.6,m:4,p:10,c:10},{r:180,m:15,p:30,c:25}],SE=[{m:1,p:2,c:1},{m:3,p:10,c:4},{m:2,p:5,c:3}];
const LA=[{c:40,cap:[400,0,0]},{c:90,cap:[900,500,250]},{c:160,cap:[2500,1400,800]}];
const OR=[{alt:500,sun:.65,ct:.1,ds:1},{alt:20200,sun:.9,ct:.35,ds:.35},{alt:35786,sun:.99,ct:1,ds:.2}];
const BASE={m:120,p:100,c:25},BUD=250,TG=150,DAYS=30,BM=40,BC=8,MU=398600;
const S={scr:"home",i:null,p:null,a:null,s:[0,0,0],b:0,g:0,l:null,o:null,prev:null,sim:null,fv:0};
const T0=OR.map(o=>2*Math.PI*Math.sqrt(Math.pow(6371+o.alt,3)/MU)),W_=T0.map(q=>2*Math.PI/(7*q/T0[0])),WE=2*Math.PI/(7*86400/T0[0]);
const ns=()=>S.s.reduce((a,b)=>a+b,0);
function tot(){const I=INS[S.i],P=PW[S.p],A=AN[S.a];let m=BASE.m+(I?I.m:0)+(P?P.m:0)+(A?A.m:0)+(S.b?BM:0),n=BASE.p+(I?I.p:0)+(A?A.p:0),c=BASE.c+(I?I.c:0)+(P?P.c:0)+(A?A.c:0)+(S.b?BC:0)+(S.l!=null?LA[S.l].c:0)+(S.g?15:0);S.s.forEach((v,k)=>{if(v){m+=SE[k].m;n+=SE[k].p;c+=SE[k].c}});return{m,need:n,cost:c,gen:P?P.w:0}}
function run(o){const q=tot(),I=INS[S.i],A=AN[S.a],O=OR[o],pt=Math.min(1,.75+.1*ns()),ds=[];let st=0,tt=0,pr=0,dn=0,du=0;for(let d=1;d<=DAYS;d++){const sm=d>=14&&d<=16?.5:1,av=q.gen*(S.b?.9:O.sun)*sm;let dt=Math.min(1,av/q.need);if(dt<.3)dt=0;const p=I.r*dt*I.q[o]*pt,dw=A.r*(O.ct*O.ds/.1)*(1+S.g);st=Math.min(20,st+p);const r=Math.min(st,dw);st-=r;tt+=r;pr+=p;dn+=dw;du+=dt;ds.push({tt,storm:sm<1})}return{ds,total:tt,pr,dn,duty:du/DAYS,q,pt}}
function valid(){if(S.l==null||S.o==null)return t("e0");const q=tot(),cap=LA[S.l].cap[S.o];if(!cap)return t("e1");if(q.m>cap)return t("e2").replace("{a}",q.m).replace("{b}",cap);if(q.cost>BUD)return t("e3").replace("{a}",q.cost).replace("{b}",BUD);return""}

let AC=null,MUTE=false;function au(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==="suspended")AC.resume();return AC}
function tone(f,d,ty,v,f2){const a=au();if(!a||MUTE)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime;o.type=ty||"sine";o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v||.08,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g).connect(a.destination);o.start(n);o.stop(n+d)}
function noise(d,v,f1,f2){const a=au();if(!a||MUTE)return;const n=a.currentTime,b=a.createBuffer(1,Math.ceil(a.sampleRate*d),a.sampleRate),x=b.getChannelData(0);for(let i=0;i<x.length;i++)x[i]=Math.random()*2-1;const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain(),tl=Math.min(1,d*.5);s.buffer=b;f.type="lowpass";f.frequency.setValueAtTime(f1,n);f.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(.0001,n);g.gain.exponentialRampToValueAtTime(v,n+Math.min(1.5,d*.3));g.gain.setValueAtTime(v,n+d-tl);g.gain.exponentialRampToValueAtTime(.0001,n+d);s.connect(f).connect(g).connect(a.destination);s.start(n)}

function say(lines,cb){clearInterval(tp);lines=[].concat(lines);let k=0;const tx=$("#tx"),nx=$("#nx"),pv=$("#pv");function done(){clearInterval(tp);pv.classList.remove("talk");if(k<lines.length-1)nx.hidden=false;else if(cb)cb()}function go(){const s=lines[k];tx.textContent="";let i=0;pv.classList.add("talk");nx.hidden=true;clearInterval(tp);tp=setInterval(()=>{tx.textContent=s.slice(0,++i);if(i>=s.length)done()},22)}
nx.onclick=e=>{e.stopPropagation();if(k<lines.length-1){k++;go()}};$("#bub").onclick=()=>{if(tx.textContent.length<lines[k].length){tx.textContent=lines[k];done()}};go()}

const bar=(l,v,mx,u,w)=>{const p=Math.min(100,v/mx*100);return`<div class="gg"><div><span>${l}</span><span>${Math.round(v)} / ${mx} ${u}</span></div><div class="br"><i class="${v>mx?"x":w?"w":""}" style="width:${p}%"></i></div></div>`};

function gauges(){const q=tot(),cap=S.l!=null&&S.o!=null?LA[S.l].cap[S.o]:2500;let e="";if(S.i!=null&&S.a!=null&&S.p!=null){const r=run(S.o!=null?S.o:0);e=bar(t("est"),r.total,TG,"",r.total<TG)}return bar(t("m"),q.m,cap||1,"kg",q.m>cap*.85)+bar(t("w"),q.need,Math.max(q.gen,1),"W",q.need>q.gen*.9)+bar(t("b"),q.cost,BUD,"M$",q.cost>BUD*.9)+e}

won?SFX.win():SFX.lose();$("#p3").hidden=false;$("#p3").innerHTML=`<h2>${won?t("win"):t("lose")}</h2><p>${Math.round(s.total)} ${t("res")} ${TG}.${S.prev!=null?" "+t("pv")+" : "+S.prev+".":""}</p><div class="big">${sc} ${t("pts")}</div>${ax.map((a,i)=>b(a,v[i])).join("")}<p style="margin-top:10px">${w}</p><button class="btn" onclick="S.prev=${sc};S.sim=null;go('atelier');say(t('mid'))">${t("mod")}</button><button class="btn g" onclick="location.reload()">${t("again")}</button>`;say([won?t("win"):t("lose"),w])}
/* ---- boucle ---- */
function frame(now){const sm=S.sim;
if(S.scr==="atelier")drawV(CV,now);else if(S.scr==="orbit")drawMap(CM,now);else if(S.scr==="flight"){if(sm){if(sm.ph===0&&(now-sm.t0)>9000){sm.ph=1;sm.t1=now;SFX.orbit();say(t("or2"))}
if(sm.ph===1){const d=Math.min(DAYS,(now-sm.t1)/18000*DAYS);sm.day=d;const i=Math.min(DAYS,Math.max(1,Math.ceil(d))),r=sm.res.ds[i-1];sm.data=r.tt;if(r.storm&&!sm.ann.s){sm.ann.s=1;SFX.alert();say(t("st"))}if(d>=DAYS){sm.ph=2;sm.t2=now}}
else if(sm.ph===2&&!sm.sh&&now-sm.t2>900){sm.sh=1;debrief()}}
S.fv?drawMap(CM2,now):drawF(CF,now);if(sm){const O=OR[S.o],a=O.alt,v=Math.sqrt(MU/(6371+a));$("#tel").textContent=sm.ph===0?`${t("al")}  ${Math.round(Math.min(1,(now-sm.t0)/9000)*a)} km`:`${t("d")}  ${Math.min(DAYS,Math.ceil(sm.day)||1)} / ${DAYS}\n${t("dt")}  ${Math.round(sm.data)} / ${TG}\n${t("al")}  ${a} km\n${t("sp")}  ${v.toFixed(1)} km/s`}}
requestAnimationFrame(frame)}
/* ---- démarrage ---- */
function setLang(l){L=l;document.documentElement.lang=l;$$("#lg button").forEach(b=>b.classList.toggle("on",b.dataset.l===l));$("#sub").textContent=t("sub");$("#st").textContent="▶ "+t("start");render();if(S.scr==="home"){$("#st").hidden=true;say(t("hi"),()=>{$("#st").hidden=false})}}
$$("#lg button[data-l]").forEach(b=>b.onclick=()=>setLang(b.dataset.l));$("#mu").onclick=()=>{MUTE=!MUTE;$("#mu").textContent=MUTE?"🔇":"🔊";if(!MUTE)SFX.click()};
$("#st").onclick=()=>{go("atelier");say([t("at")[1]])};
drag($("#cv"));resize();setLang("fr");requestAnimationFrame(frame);
</script></body></html>
